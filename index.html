<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Soumia ❤️</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Georgia, "Times New Roman", serif;
  background: #000;
}

body {
  color: white;
}

/* =========================
   GENERAL
========================= */

.screen {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.hidden {
  display: none !important;
}

/* =========================
   START SCREEN
========================= */

#startScreen {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background:
    radial-gradient(circle at center, #24101c 0%, #090509 55%, #000 100%);
  z-index: 100;
}

.start-title {
  font-size: clamp(30px, 8vw, 65px);
  letter-spacing: 3px;
  text-align: center;
  margin-bottom: 40px;
  text-shadow:
    0 0 10px #ff4f9a,
    0 0 30px #ff1f75,
    0 0 60px #ff1f75;
  animation: titlePulse 2s infinite alternate;
}

.start-button {
  border: 1px solid rgba(255,255,255,.7);
  background: rgba(255,255,255,.08);
  color: white;
  padding: 18px 35px;
  border-radius: 50px;
  font-size: 19px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  box-shadow:
    0 0 20px rgba(255,70,150,.5),
    inset 0 0 20px rgba(255,255,255,.08);
  transition: .4s;
}

.start-button:hover {
  transform: scale(1.08);
  background: rgba(255,255,255,.18);
  box-shadow:
    0 0 30px #ff4f9a,
    0 0 70px #ff1f75;
}

@keyframes titlePulse {
  from {
    transform: scale(1);
    opacity: .8;
  }
  to {
    transform: scale(1.05);
    opacity: 1;
  }
}

/* =========================
   COUNTDOWN
========================= */

#countdown {
  display: none;
  align-items: center;
  justify-content: center;
  background: #000;
  z-index: 90;
  filter: grayscale(1) contrast(1.5);
}

.count-number {
  color: white;
  font-family: Arial, sans-serif;
  font-size: clamp(100px, 30vw, 260px);
  font-weight: 900;
  text-shadow: 0 0 2px white;
  animation: cinemaNumber 1s ease-in-out;
}

@keyframes cinemaNumber {
  0% {
    opacity: 0;
    transform: scale(1.5);
  }

  25% {
    opacity: 1;
    transform: scale(1);
  }

  75% {
    opacity: 1;
    transform: scale(.95);
  }

  100% {
    opacity: 0;
    transform: scale(.7);
  }
}

/* Film bars */

#countdown::before,
#countdown::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 55px;
  background: #000;
  z-index: 2;
}

#countdown::before {
  top: 0;
}

#countdown::after {
  bottom: 0;
}

/* =========================
   PARTY SCREEN
========================= */

#party {
  display: none;
  background:
    radial-gradient(circle at 50% 45%, #471536 0%, #17091a 40%, #030005 100%);
  perspective: 1000px;
  z-index: 50;
}

/* Background lights */

.light {
  position: absolute;
  width: 170px;
  height: 170px;
  border-radius: 50%;
  filter: blur(35px);
  opacity: .65;
  animation: lightMove 4s infinite alternate ease-in-out;
}

.light:nth-child(1) {
  background: #ff176f;
  left: -50px;
  top: -30px;
}

.light:nth-child(2) {
  background: #8c36ff;
  right: -50px;
  top: 10%;
  animation-delay: 1s;
}

.light:nth-child(3) {
  background: #ff5b22;
  left: 20%;
  bottom: -80px;
  animation-delay: 2s;
}

.light:nth-child(4) {
  background: #00c8ff;
  right: 15%;
  bottom: -70px;
  animation-delay: 3s;
}

@keyframes lightMove {
  from {
    transform: scale(.7) translate3d(0,0,0);
    opacity: .35;
  }

  to {
    transform: scale(1.5) translate3d(30px,-20px,100px);
    opacity: .8;
  }
}

/* =========================
   BOTTOM EXPLOSION
========================= */

.explosion {
  position: absolute;
  bottom: -10px;
  left: 50%;
  width: 10px;
  height: 10px;
  transform: translateX(-50%);
}

.spark {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 5px;
  height: 80px;
  border-radius: 50%;
  background: white;
  box-shadow:
    0 0 8px white,
    0 0 20px #ff2f91,
    0 0 40px #ff2f91;
  transform-origin: bottom center;
  animation: sparkExplosion 1.8s ease-out forwards;
}

@keyframes sparkExplosion {
  0% {
    opacity: 1;
    transform: rotate(var(--angle)) scaleY(.1);
  }

  100% {
    opacity: 0;
    transform:
      rotate(var(--angle))
      translateY(-330px)
      scaleY(1);
  }
}

/* =========================
   SMALL WORDS AT CORNERS
========================= */

.corner-love {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 20;
}

.corner-love span {
  position: absolute;
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(255,255,255,.6);
  text-shadow:
    0 0 5px white,
    0 0 10px #ff4f9a;
  animation: cornerGlow 2.5s infinite alternate;
}

.corner-love span:nth-child(1) {
  top: 15px;
  right: 12px;
}

.corner-love span:nth-child(2) {
  top: 15px;
  left: 12px;
}

.corner-love span:nth-child(3) {
  bottom: 15px;
  right: 12px;
}

.corner-love span:nth-child(4) {
  bottom: 15px;
  left: 12px;
}

@keyframes cornerGlow {
  0% {
    opacity: .25;
    transform: scale(.85);
  }

  100% {
    opacity: .9;
    transform: scale(1);
  }
}

/* =========================
   CENTER AREA
========================= */

.center {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 10;
}

/* =========================
   HEART
========================= */

.heart-container {
  width: 170px;
  height: 170px;
  position: relative;
  transform: rotate(-45deg);
  animation:
    heartAppear 3s ease forwards,
    heartBeat 1.5s 3s infinite;
  filter:
    drop-shadow(0 0 15px #ff1f75)
    drop-shadow(0 0 40px #ff1f75)
    drop-shadow(0 0 80px rgba(255,20,100,.7));
}

.heart-container::before,
.heart-container::after {
  content: "";
  position: absolute;
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: linear-gradient(
    135deg,
    #ff78ad,
    #ff176f 50%,
    #b8004d
  );
}

.heart-container::before {
  top: -85px;
  left: 0;
}

.heart-container::after {
  top: 0;
  left: 85px;
}

.heart-main {
  position: absolute;
  width: 170px;
  height: 170px;
  background: linear-gradient(
    135deg,
    #ff78ad,
    #ff176f 50%,
    #b8004d
  );
  z-index: 2;
}

.heart-text {
  position: absolute;
  z-index: 10;
  transform: rotate(45deg);
  width: 260px;
  left: -45px;
  top: 55px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  color: white;
  text-shadow:
    0 0 10px white,
    0 0 25px #ff8fbc,
    0 0 40px #ff176f;
}

@keyframes heartAppear {
  0% {
    transform: rotate(-45deg) scale(0);
    opacity: 0;
  }

  50% {
    transform: rotate(-45deg) scale(1.25);
    opacity: 1;
  }

  100% {
    transform: rotate(-45deg) scale(1);
    opacity: 1;
  }
}

@keyframes heartBeat {
  0%,100% {
    transform: rotate(-45deg) scale(1);
  }

  50% {
    transform: rotate(-45deg) scale(1.12);
  }
}

/* =========================
   MESSAGE
========================= */

.message {
  position: absolute;
  bottom: 12%;
  width: 90%;
  max-width: 600px;
  text-align: center;
  font-size: clamp(17px, 4vw, 27px);
  line-height: 1.7;
  opacity: 0;
  transform: translateY(30px);
  text-shadow:
    0 0 10px white,
    0 0 25px #ff4f9a;
}

.message.show {
  animation: messageIn 2s ease forwards;
}

@keyframes messageIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* =========================
   I LOVE YOU
========================= */

.love-screen {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  opacity: 0;
}

.love-screen.show {
  animation: loveShow 2s ease forwards;
}

.love-line {
  font-family: Arial, sans-serif;
  font-weight: 900;
  font-size: clamp(45px, 13vw, 110px);
  letter-spacing: 5px;
  text-align: center;
  text-shadow:
    0 0 10px white,
    0 0 25px #ff2c85,
    0 0 50px #ff2c85,
    0 0 90px #ff0066;
  animation: lovePulse 1.5s infinite alternate;
}

.love-heart {
  font-size: clamp(45px, 12vw, 90px);
  margin-top: 15px;
  animation: floatingHeart 1.5s infinite alternate;
}

@keyframes loveShow {
  from {
    opacity: 0;
    transform: scale(.5);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes lovePulse {
  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.08);
  }
}

@keyframes floatingHeart {
  from {
    transform: translateY(0) scale(1);
  }

  to {
    transform: translateY(-15px) scale(1.15);
  }
}

/* =========================
   FINAL SCREEN
========================= */

.final-screen {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  background:
    radial-gradient(circle at center, #45132c 0%, #160813 50%, #020002 100%);
  z-index: 100;
}

.final-screen.show {
  display: flex;
  animation: finalAppear 2s ease;
}

.final-title {
  font-size: clamp(35px, 9vw, 75px);
  font-weight: bold;
  text-shadow:
    0 0 10px white,
    0 0 25px #ff4f9a,
    0 0 60px #ff176f;
  animation: finalPulse 2s infinite alternate;
}

.final-date {
  margin-top: 25px;
  font-family: Arial, sans-serif;
  font-size: clamp(20px, 5vw, 35px);
  letter-spacing: 3px;
  color: #ffd9e9;
  text-shadow:
    0 0 10px #ff4f9a,
    0 0 30px #ff176f;
}

.final-heart {
  font-size: 60px;
  margin-top: 25px;
  animation: finalHeart 1.3s infinite alternate;
}

@keyframes finalAppear {
  from {
    opacity: 0;
    transform: scale(.8);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes finalPulse {
  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.06);
  }
}

@keyframes finalHeart {
  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.25);
  }
}

/* =========================
   STARS
========================= */

.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 8px white;
  animation: starBlink 2s infinite alternate;
}

@keyframes starBlink {
  from {
    opacity: .2;
  }

  to {
    opacity: 1;
  }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .heart-container {
    width: 125px;
    height: 125px;
  }

  .heart-container::before,
  .heart-container::after {
    width: 125px;
    height: 125px;
  }

  .heart-container::before {
    top: -62px;
  }

  .heart-container::after {
    left: 62px;
  }

  .heart-main {
    width: 125px;
    height: 125px;
  }

  .heart-text {
    font-size: 21px;
    width: 200px;
    left: -37px;
    top: 40px;
  }

  .corner-love span {
    font-size: 8px;
    letter-spacing: 1px;
  }
}
</style>
</head>

<body>

<!-- =========================
     START
========================= -->

<section id="startScreen" class="screen">

  <div class="start-title">
    A Special Surprise ❤️
  </div>

  <button class="start-button" onclick="begin()">
    اضغطي هنا ❤️
  </button>

</section>


<!-- =========================
     COUNTDOWN
========================= -->

<section id="countdown" class="screen">
  <div id="countNumber" class="count-number">3</div>
</section>


<!-- =========================
     PARTY
========================= -->

<section id="party" class="screen">

  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>

  <div id="stars"></div>

  <!-- Small words at the extreme corners -->
  <div class="corner-love">
    <span>YOU ❤️</span>
    <span>A LOVE ❤️</span>
    <span>YOU ❤️</span>
    <span>A LOVE ❤️</span>
  </div>

  <!-- Bottom explosion -->
  <div class="explosion" id="explosion"></div>

  <!-- Center -->
  <div class="center">

    <div class="heart-container">
      <div class="heart-main"></div>
      <div class="heart-text">
        Soumia ❤️
      </div>
    </div>

    <div class="message" id="message">
      You are one of the most beautiful parts of my life. ❤️
      <br>
      May your smile always shine brighter than the stars.
    </div>

  </div>


  <!-- I LOVE YOU -->
  <div class="love-screen" id="loveScreen">

    <div class="love-line">
      I LOVE YOU
    </div>

    <div class="love-heart">
      ❤️
    </div>

  </div>


  <!-- FINAL -->
  <div class="final-screen" id="finalScreen">

    <div class="final-title">
      Happy Birthday, Soumia ❤️
    </div>

    <div class="final-date">
      15 October 2010 🎂
    </div>

    <div class="final-heart">
      ❤️
    </div>

  </div>

</section>


<script>

/* =========================
   VARIABLES
========================= */

let musicStarted = false;


/* =========================
   CREATE STARS
========================= */

function createStars() {

  const stars = document.getElementById("stars");

  for (let i = 0; i < 70; i++) {

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";

    star.style.animationDelay =
      Math.random() * 2 + "s";

    stars.appendChild(star);
  }
}


/* =========================
   EXPLOSION
========================= */

function createExplosion() {

  const explosion =
    document.getElementById("explosion");

  for (let i = 0; i < 70; i++) {

    const spark =
      document.createElement("div");

    spark.className = "spark";

    const angle =
      (Math.random() * 140 - 70);

    spark.style.setProperty(
      "--angle",
      angle + "deg"
    );

    spark.style.animationDelay =
      Math.random() * .6 + "s";

    spark.style.height =
      (50 + Math.random() * 130) + "px";

    explosion.appendChild(spark);
  }
}


/* =========================
   CONFETTI
========================= */

function createConfetti() {

  for (let i = 0; i < 100; i++) {

    const piece =
      document.createElement("div");

    piece.style.position = "fixed";
    piece.style.top = "-20px";
    piece.style.left = Math.random() * 100 + "%";

    piece.style.width = "6px";
    piece.style.height = "12px";

    piece.style.background =
      ["#ff2f91","#fff","#ffd166","#6ee7ff","#b86bff"][
        Math.floor(Math.random() * 5)
      ];

    piece.style.transform =
      "rotate(" + Math.random() * 360 + "deg)";

    piece.style.zIndex = "30";

    piece.style.transition =
      "transform 4s linear, top 4s linear";

    document.body.appendChild(piece);

    setTimeout(() => {

      piece.style.top = "110%";

      piece.style.transform =
        "rotate(" +
        (Math.random() * 1000) +
        "deg)";

    }, 50);

    setTimeout(() => {
      piece.remove();
    }, 4500);
  }
}


/* =========================
   MUSIC
   Simple generated melody
========================= */

function playBirthdayMusic() {

  if (musicStarted) return;

  musicStarted = true;

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if (!AudioContext) return;

  const audio =
    new AudioContext();

  const notes = [
    261.63,
    261.63,
    293.66,
    261.63,
    349.23,
    329.63,

    261.63,
    261.63,
    293.66,
    261.63,
    392.00,
    349.23,

    261.63,
    261.63,
    523.25,
    440.00,
    349.23,
    329.63,
    293.66,

    466.16,
    466.16,
    440.00,
    349.23,
    392.00,
    349.23
  ];

  let startTime =
    audio.currentTime;

  function playNotes() {

    notes.forEach((frequency, index) => {

      const oscillator =
        audio.createOscillator();

      const gain =
        audio.createGain();

      oscillator.type = "sine";

      oscillator.frequency.value =
        frequency;

      oscillator.connect(gain);
      gain.connect(audio.destination);

      const time =
        startTime + index * .28;

      gain.gain.setValueAtTime(
        0,
        time
      );

      gain.gain.linearRampToValueAtTime(
        .12,
        time + .03
      );

      gain.gain.exponentialRampToValueAtTime(
        .001,
        time + .25
      );

      oscillator.start(time);
      oscillator.stop(time + .27);
    });

    startTime +=
      notes.length * .28 + 1;

    setTimeout(
      playNotes,
      (notes.length * .28 + 1) * 1000
    );
  }

  playNotes();
}


/* =========================
   COUNTDOWN
========================= */

function runCountdown() {

  const countdown =
    document.getElementById("countdown");

  const number =
    document.getElementById("countNumber");

  countdown.style.display = "flex";

  let count = 3;

  function showNumber() {

    number.textContent = count;

    number.style.animation = "none";

    void number.offsetWidth;

    number.style.animation =
      "cinemaNumber 1s ease-in-out";

    if (count === 0) {

      countdown.style.display = "none";

      showParty();

      return;
    }

    count--;

    setTimeout(
      showNumber,
      1000
    );
  }

  showNumber();
}


/* =========================
   PARTY
========================= */

function showParty() {

  const party =
    document.getElementById("party");

  party.style.display = "block";

  createExplosion();
  createConfetti();

  setTimeout(() => {

    document
      .querySelector(".heart-container")
      .style.display = "none";

    showMessage();

  }, 10000);
}


/* =========================
   MESSAGE
========================= */

function showMessage() {

  const message =
    document.getElementById("message");

  message.classList.add("show");

  setTimeout(() => {

    message.style.display = "none";

    showLove();

  }, 15000);
}


/* =========================
   I LOVE YOU
========================= */

function showLove() {

  const love =
    document.getElementById("loveScreen");

  love.classList.add("show");

  setTimeout(() => {

    love.style.display = "none";

    showFinal();

  }, 20000);
}


/* =========================
   FINAL
========================= */

function showFinal() {

  const finalScreen =
    document.getElementById("finalScreen");

  finalScreen.classList.add("show");

  createConfetti();
}


/* =========================
   START EVERYTHING
========================= */

function begin() {

  playBirthdayMusic();

  const start =
    document.getElementById("startScreen");

  start.style.transition =
    "opacity 1.5s ease";

  start.style.opacity = "0";

  setTimeout(() => {

    start.style.display = "none";

    runCountdown();

  }, 1500);
}


/* =========================
   INIT
========================= */

createStars();

</script>

</body>
  </html>
